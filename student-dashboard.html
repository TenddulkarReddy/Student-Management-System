<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | StudentHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="logo">StudentHub</h2>

        <nav>
            <a href="student-dashboard.html" class="active">My Profile</a>
            <a href="#" id="logoutBtn">Log Out</a>
        </nav>

        <div class="sidebar-bottom">
            <p>Student Portal</p>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">
            <div>
                <h1 id="portalHeaderName">Welcome</h1>
                <p>Academic profile and status</p>
            </div>
            <div class="admin" id="portalBadge">Student</div>
        </header>

        <!-- Profile Section -->
        <section class="profile-section">

            <div class="profile-header">
                <div class="profile-avatar" id="portalAvatar">S</div>
                <div>
                    <h2 id="portalName">Loading...</h2>
                    <p id="portalId">ID: Loading...</p>
                    <span class="status-label">Enrolled & Active</span>
                </div>
            </div>

            <div class="profile-details">
                <h2>Personal Information</h2>
                <div class="profile-grid">
                    <div class="detail-card">
                        <label>Student ID</label>
                        <p id="detailId">---</p>
                    </div>

                    <div class="detail-card">
                        <label>Full Name</label>
                        <p id="detailName">---</p>
                    </div>

                    <div class="detail-card">
                        <label>Department</label>
                        <p id="detailDept">---</p>
                    </div>

                    <div class="detail-card">
                        <label>Academic Year</label>
                        <p id="detailYear">---</p>
                    </div>
                </div>
            </div>

        </section>

        <!-- Academic Info -->
        <section class="profile-section project-info">
            <h2>Enrollment Overview</h2>
            <div class="profile-grid">
                <div class="detail-card">
                    <label>Status</label>
                    <p>Regular Full-Time</p>
                </div>
                <div class="detail-card">
                    <label>Campus Access</label>
                    <p>Authorized</p>
                </div>
            </div>
        </section>

        <footer>
            <p>© 2026 StudentHub | Student Management System</p>
        </footer>

    </main>

</div>

<script src="js/storage.js"></script>
<script src="js/student-portal.js"></script>
</body>
</html>
